<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - VibeEra Diwali</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#121212;
color:#e0e0e0;
min-height:100vh;
display:flex;
flex-direction:column;
}

header{
background:#1a1a1a;
padding:18px 5%;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom: 1px solid #333;
}

.logo{
font-size:28px;
font-weight:700;
color: #d4af37;
}

header a{
text-decoration:none;
color:#e0e0e0;
font-weight:600;
}

.container{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:30px;
}

.register-card{
background:#1e1e1e;
width:100%;
max-width:500px;
padding:35px;
border-radius:15px;
border: 1px solid #333;
box-shadow:0 5px 20px rgba(0,0,0,.5);
}

.register-card h2{
text-align:center;
margin-bottom:10px;
color: #d4af37;
}

.register-card p{
text-align:center;
color:#aaa;
margin-bottom:25px;
}

.input-group{
margin-bottom:16px;
}

.input-group label{
display:block;
margin-bottom:6px;
font-weight:600;
color:#ccc;
}

.input-group input{
width:100%;
padding:12px;
background:#121212;
border:1px solid #444;
color:#fff;
border-radius:8px;
font-size:15px;
}

.password-box{
position:relative;
}

.password-box button{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
background:none;
border:none;
cursor:pointer;
font-size:14px;
color:#d4af37;
font-weight: bold;
}

.register-btn{
width:100%;
padding:12px;
background:#d4af37;
color:#121212;
border:none;
border-radius:8px;
font-size:16px;
font-weight: bold;
cursor:pointer;
margin-top:10px;
}

.register-btn:hover{
background:#ffdf73;
}

.links{
text-align:center;
margin-top:20px;
}

.links a{
text-decoration:none;
font-weight:600;
color:#d4af37;
}

.note{
margin-top:20px;
background:#26220d;
border: 1px solid #443b0c;
padding:12px;
border-radius:8px;
font-size:14px;
color:#ffdf73;
text-align:center;
}

footer{
background:#0a0a0a;
color:#aaa;
text-align:center;
padding:20px;
border-top: 1px solid #333;
}

footer p{
margin:5px 0;
}
</style>
</head>

<body>

<header>
<div class="logo">🪔 VibeEra Diwali</div>
<a href="index.html">← Continue Shopping</a>
</header>

<div class="container">
<div class="register-card">
<h2>Create Your Account</h2>
<p>Join VibeEra and start shopping this festive season</p>

<form id="registerForm">
<div class="input-group">
<label>Full Name</label>
<input type="text" id="regName" placeholder="Enter your full name" required>
</div>

<div class="input-group">
<label>Phone Number</label>
<input type="tel" id="regPhone" placeholder="Enter phone number" required>
</div>

<div class="input-group">
<label>Email Address</label>
<input type="email" id="regEmail" placeholder="Enter email address" required>
</div>

<div class="input-group">
<label>Password</label>
<div class="password-box">
<input type="password" id="regPassword" placeholder="Create password" required>
<button type="button" onclick="togglePassword('regPassword',this)">Show</button>
</div>
</div>

<div class="input-group">
<label>Confirm Password</label>
<div class="password-box">
<input type="password" id="confirmPassword" placeholder="Confirm password" required>
<button type="button" onclick="togglePassword('confirmPassword',this)">Show</button>
</div>
</div>

<button type="submit" class="register-btn">Create Account</button>
</form>

<div class="links">
<p>Already have an account? <a href="login.html">Login Here</a></p>
</div>

<div class="note">
🛍️ Account stored in database.
</div>
</div>
</div>

<footer>
<p>VibeEra Accessories - Diwali Special</p>
<p>📞 +91 8423702403</p>
<p>📍 Dayanand Nagar, Gorakhpur - 273015</p>
<p>© 2026 VibeEra</p>
</footer>

<script src="firebase-config.js"></script>
<script>
function togglePassword(id, btn){
const field = document.getElementById(id);
if(field.type === "password"){
field.type = "text";
btn.innerText = "Hide";
} else {
field.type = "password";
btn.innerText = "Show";
}
}

document.getElementById("registerForm").addEventListener("submit", async function(e){
e.preventDefault();
const name = document.getElementById("regName").value.trim();
const phone = document.getElementById("regPhone").value.trim();
const email = document.getElementById("regEmail").value.trim().toLowerCase();
const password = document.getElementById("regPassword").value;
const confirmPassword = document.getElementById("confirmPassword").value;

if(password !== confirmPassword){
alert("Passwords do not match.");
return;
}
if(password.length < 6){
alert("Password must contain at least 6 characters.");
return;
}

const user = {
name: name,
phone: phone,
email: email,
password: password,
joined: new Date().toLocaleDateString()
};

await DB.registerUser(user);
await DB.loginUser(email, password);

alert("Account created and saved to Database successfully! Welcome to VibeEra.");
window.location.href = "index.html";
});
</script>

</body>
</html>
